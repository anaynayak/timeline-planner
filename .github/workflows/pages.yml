name: Deploy to GitHub Pages

# The app is already a static site, so "building" is just uploading the repo with the
# test scaffolding stripped out.
#
# Deploys on every push to main, plus on demand.
#
# This must be the Pages source ("Settings -> Pages -> Source: GitHub Actions"). The
# alternative, "Deploy from a branch", serves the repository root verbatim - which works,
# but skips the assembly below and so publishes src/testhooks.js, putting window.App and
# the __* helpers on the public site. Those exist only so test/browser.test.mjs can drive
# the app; nothing in the app reads them.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; don't cancel a run that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html LICENSE NOTICE _site/
          cp -r src vendor examples _site/
          # testhooks.js only exists to let test/browser.test.mjs drive the app; the app
          # itself never reads it, so a deploy can drop it. Its <script> tag is removed
          # rather than left dangling.
          rm -f _site/src/testhooks.js
          sed -i 's|<script src="src/testhooks.js"></script>||' _site/index.html
          # Pages would otherwise run the upload through Jekyll
          touch _site/.nojekyll
          # fail loudly rather than publishing a page with a dangling script tag
          for f in $(grep -oE 'src="(src|vendor)/[^"]+"' _site/index.html | sed 's/src="//;s/"//'); do
            test -f "_site/$f" || { echo "::error::_site/$f missing"; exit 1; }
          done
          ls -R _site

      - uses: actions/configure-pages@v5
        with:
          # turn Pages on for the repository if the plan allows it
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
