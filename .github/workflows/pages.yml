name: Deploy to GitHub Pages

# The app is already a static site, so "building" is just uploading the repo with the
# test scaffolding stripped out.
#
# This is manual-only on purpose. Publishing needs Pages turned on for the repository,
# and until it is every push would fail this workflow for no useful reason. To publish:
#
#   1. Settings -> Pages -> Source: GitHub Actions   (or rely on `enablement: true` below)
#   2. Actions -> Deploy to GitHub Pages -> Run workflow
#   3. once that succeeds, add the `push` trigger below to publish on every merge:
#
#        push:
#          branches: [main]
#
# Note: Pages for a private repository requires a paid GitHub plan. On the free plan
# either make the repository public or just run the tool locally (`open index.html`).

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# only one deployment at a time; don't cancel a run that is already publishing
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Logic tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test

  deploy:
    name: Deploy
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Assemble the site
        run: |
          mkdir -p _site
          cp index.html app.js LICENSE NOTICE _site/
          cp -r vendor examples _site/
          # Pages would otherwise run the upload through Jekyll
          touch _site/.nojekyll
          ls -R _site

      - uses: actions/configure-pages@v5
        with:
          # turn Pages on for the repository if the plan allows it
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
