name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  logic:
    name: Logic tests (no browser)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Run the parser, calendar, scheduler and validator assertions
        run: npm test

  browser:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install Playwright and Chromium
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install --with-deps chromium
      - name: Run rendering and drag/resize tests
        run: npm run test:browser

  hygiene:
    name: Hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Every example CSV is well formed and loads
        run: |
          python3 - <<'PY'
          import csv, glob, sys
          fail = False
          for path in sorted(glob.glob('examples/*.csv')):
              rows = list(csv.reader(open(path, encoding='utf-8-sig')))
              if len(rows) < 2:
                  print(f'{path}: fewer than 2 rows'); fail = True; continue
              width = len(rows[0])
              ragged = [i + 1 for i, r in enumerate(rows) if len(r) != width]
              if ragged:
                  print(f'{path}: ragged rows at {ragged}'); fail = True
              header = [h.strip().lower() for h in rows[0]]
              if not ({'name', 'title', 'task'} & set(header)):
                  print(f'{path}: no name/title/task column'); fail = True
              print(f'{path}: {len(rows) - 1} rows, {width} columns, ok')
          sys.exit(1 if fail else 0)
          PY

      - name: Vendored licence and attribution are present
        run: |
          test -f NOTICE || { echo "::error::NOTICE is missing"; exit 1; }
          fail=0
          # every vendored bundle needs its licence text on disk and a credit in NOTICE
          for want in frappe-gantt.LICENSE.txt preact.LICENSE.txt htm.LICENSE.txt; do
            test -f "vendor/$want" || { echo "::error::vendor/$want is missing"; fail=1; }
          done
          for want in 'frappe/gantt' 'preactjs/preact' 'developit/htm'; do
            grep -q "$want" NOTICE || { echo "::error::NOTICE does not credit $want"; fail=1; }
          done
          for want in 'frappe/gantt' 'preactjs.com' 'developit/htm'; do
            grep -q "$want" index.html || { echo "::error::UI does not credit $want"; fail=1; }
          done
          test "$fail" = 0 || exit 1
          echo "attribution ok"

      - name: Every src module is loaded by index.html
        run: |
          # the app is ordered classic scripts, so a new file in src/ that nobody adds a
          # <script> tag for is dead code that still passes the logic suite
          fail=0
          for f in src/*.js; do
            grep -q "src=\"$f\"" index.html || { echo "::error::$f has no <script> tag in index.html"; fail=1; }
          done
          # and a tag pointing at a file that no longer exists breaks the page outright
          grep -oE 'src="src/[^"]+\.js"' index.html | sed 's/src="//;s/"//' | while read -r f; do
            test -f "$f" || { echo "::error::index.html loads $f, which does not exist"; exit 1; }
          done
          test "$fail" = 0 || exit 1
          echo "every module is wired up"

      - name: App makes no network requests
        run: |
          # the tool must work offline; nothing may be pulled from a CDN.
          # w3.org/2000/svg is the SVG XML namespace - an identifier, not a fetch.
          if grep -nrE 'https?://[^"'"'"' ]*\.(js|css)' index.html src/ vendor/ \
               | grep -v 'w3\.org' ; then
            echo "::error::remote script or stylesheet referenced - vendor it instead"
            exit 1
          fi
          echo "no remote assets referenced"
