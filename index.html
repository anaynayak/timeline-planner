<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Timeline Planner</title>
<link rel="stylesheet" href="vendor/frappe-gantt.css">
<link rel="stylesheet" href="vendor/driver.css">
<script>
  /* Stamp the saved theme before first paint. Inline and in <head> on purpose: the app
     scripts load at the end of <body>, so doing this there would flash the wrong theme.
     "auto" stores nothing and leaves prefers-color-scheme in charge. */
  try {
    var t = localStorage.getItem('miro-timeline:theme');
    if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
  } catch (e) { /* private mode - fall back to the OS preference */ }
</script>
<style>
  /* ---------- theme tokens ----------
     Every colour in this file and in src/ comes from a token below, so a theme is a
     value swap and nothing else. Light is the base; dark is declared under BOTH a
     prefers-color-scheme block and a [data-theme=dark] scope, so an explicit choice in
     the toolbar wins over the OS setting in either direction. The :not() guard is what
     lets a light stamp beat OS-dark; :where() keeps the media block's specificity at 0
     so the explicit scopes always win.

     --series-1..8 are the categorical tag slots. Both sets are validated for their own
     surface (lightness band, chroma floor, colourblind separation, contrast) - they are
     not one palette with a brightness flip. Do not hand-tweak a step: re-run the
     validator. Slots are assigned in fixed order and never cycled; a 9th tag folds into
     --series-none rather than inventing a hue. */
  :root {
    color-scheme: light;
    --bg: #fcfcfb;
    --panel: #f5f5f3;
    --panel-2: #ffffff;
    --panel-3: #ebebe7;          /* hover */
    --line: #d9d9d4;
    --line-strong: #bfbfb8;
    --line-2: #ececE8;           /* subtle row rules */
    --fg: #17171a;
    --fg-dim: #52514e;
    --accent: #2a78d6;
    --on-accent: #ffffff;
    --sel-bg: #dce9fa;
    --drop-veil: rgba(252, 252, 251, .93);
    --shadow: rgba(23, 23, 26, .18);
    --accent-ring: rgba(42, 120, 214, .28);

    /* status - reserved, never used as a series colour */
    --warn: #a8690a;
    --warn-bg: #fdf3e2;
    --warn-fg: #7a4c05;
    --err: #c0342f;
    --err-bg: #fdecea;
    --err-fg: #8f1f1b;
    --ok: #157a4a;
    --ok-bg: #e7f6ed;
    --ok-fg: #0e5a36;
    --danger-line: #e3b3b0;
    --danger-fg: #b3211c;
    --crit: #d5342f;
    --crit-fg: #8c4a42;   /* muted: the critical path is emphasis, not an error */

    /* chart chrome */
    --row: #ffffff;
    --row-line: #eeeeea;
    --tick: #ececE8;
    --tick-thick: #d5d5cf;
    --arrow: #8c8c85;
    --handle: #4a4a45;

    /* categorical tag slots, validated for the light surface */
    --series-none: #9aa0ab;
    --series-1: #2a78d6;
    --series-2: #eb6834;
    --series-3: #1baf7a;
    --series-4: #eda100;
    --series-5: #e87ba4;
    --series-6: #008300;
    --series-7: #4a3aa7;
    --series-8: #e34948;
  }

  /* the dark values, declared once and applied from two scopes */
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --panel-3: #252a34;
      --line: #2b303b; --line-strong: #3d444f; --line-2: #1b1f27;
      --fg: #e6e9ef; --fg-dim: #9aa3b2; --accent: #4c8dff; --on-accent: #ffffff;
      --sel-bg: #263041; --drop-veil: rgba(15, 17, 21, .92);
      --shadow: rgba(0, 0, 0, .45);
      --accent-ring: rgba(76, 141, 255, .34);
      --warn: #d99b32; --warn-bg: #382c1a; --warn-fg: #f0bd6a;
      --err: #e05561; --err-bg: #3a1f23; --err-fg: #ff8f98;
      --ok: #4bb87c; --ok-bg: #1c3327; --ok-fg: #7fd6a3;
      --danger-line: #5c2b30; --danger-fg: #ff9aa2;
      --crit: #ff5f6d; --crit-fg: #ffc9cd;
      --row: #14171d; --row-line: #21252e; --tick: #222731; --tick-thick: #333a47;
      --arrow: #6b7484; --handle: #cfd6e4;
      --series-none: #5b6270;
      --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
      --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0f1115; --panel: #171a21; --panel-2: #1e222b; --panel-3: #252a34;
    --line: #2b303b; --line-strong: #3d444f; --line-2: #1b1f27;
    --fg: #e6e9ef; --fg-dim: #9aa3b2; --accent: #4c8dff; --on-accent: #ffffff;
    --sel-bg: #263041; --drop-veil: rgba(15, 17, 21, .92);
    --shadow: rgba(0, 0, 0, .45);
    --accent-ring: rgba(76, 141, 255, .34);
    --warn: #d99b32; --warn-bg: #382c1a; --warn-fg: #f0bd6a;
    --err: #e05561; --err-bg: #3a1f23; --err-fg: #ff8f98;
    --ok: #4bb87c; --ok-bg: #1c3327; --ok-fg: #7fd6a3;
    --danger-line: #5c2b30; --danger-fg: #ff9aa2;
    --crit: #ff5f6d; --crit-fg: #ffc9cd;
    --row: #14171d; --row-line: #21252e; --tick: #222731; --tick-thick: #333a47;
    --arrow: #6b7484; --handle: #cfd6e4;
    --series-none: #5b6270;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500;
    --series-5: #d55181; --series-6: #008300; --series-7: #9085e9; --series-8: #e66767;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--bg); color: var(--fg);
    font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    display: flex; flex-direction: column; overflow: hidden;
  }
  button, input, select, textarea { font: inherit; color: inherit; }
  button {
    background: var(--panel-2); border: 1px solid var(--line); color: var(--fg);
    border-radius: 6px; padding: 5px 10px; cursor: pointer;
  }
  button:hover:not(:disabled) { border-color: var(--line-strong); background: var(--panel-3); }
  button:disabled { opacity: .4; cursor: default; }
  button.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  button.danger { border-color: var(--danger-line); color: var(--danger-fg); }
  input[type=text], input[type=number], input[type=date], textarea, select {
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px;
  }
  input[type=number] { width: 70px; }
  label { color: var(--fg-dim); }

  /* ---------- toolbar ---------- */
  #toolbar {
    display: flex; flex-wrap: wrap; gap: 14px; align-items: center;
    padding: 9px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
    flex: 0 0 auto;
  }
  #toolbar .grp { display: flex; gap: 6px; align-items: center; }
  #toolbar .grp > label { white-space: nowrap; }
  #toolbar .sep { width: 1px; height: 22px; background: var(--line); }
  .seg { display: inline-flex; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; }
  .seg button { border: 0; border-radius: 0; padding: 5px 9px; background: transparent; }
  .seg button.on { background: var(--accent); color: var(--on-accent); }
  .brand { font-weight: 600; letter-spacing: .2px; margin-right: 4px; }
  .brand small { color: var(--fg-dim); font-weight: 400; }
  /* the bundled plan is invented data; say so where the filename would be */
  .brand small.example::after { content: 'example'; margin-left: 6px; padding: 1px 6px;
    border-radius: 999px; background: var(--warn-bg); color: var(--warn-fg);
    font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: .4px; }
  .badge { border-radius: 999px; padding: 1px 7px; font-size: 11px; font-weight: 600; }
  .badge.err { background: var(--err-bg); color: var(--err-fg); }
  .badge.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .badge.ok { background: var(--ok-bg); color: var(--ok-fg); }

  /* the tier-2/3 cluster sits hard right so the visible controls read left-to-right as
     "what I did / how dragging behaves / how close I am looking" */
  #toolbar .trailing { margin-left: auto; }

  /* Below this width the trailing group gets pushed onto a second row by its own
     margin-left:auto. The group labels are the cheapest thing to give up: "Rigid | ASAP"
     and "Day | Compact | Tiny" already say what they are, and the title attributes stay. */
  @media (max-width: 1280px) {
    #toolbar { gap: 10px; }
    #toolbar .grp > label { display: none; }
  }

  /* ---------- menus ---------- */
  .menu { position: relative; display: inline-flex; }
  .menu > button[aria-expanded="true"] { border-color: var(--accent); color: var(--accent); }
  .menu-pop {
    position: absolute; top: calc(100% + 6px); right: 0; z-index: 80;
    min-width: 190px; padding: 5px; display: flex; flex-direction: column; gap: 2px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px;
    box-shadow: 0 12px 32px var(--shadow);
  }
  .menu-pop.wide { min-width: 260px; }
  .menu-pop[hidden] { display: none; }
  .menu-pop > button {
    background: transparent; border: 0; border-radius: 5px; text-align: left;
    padding: 6px 9px; width: 100%;
  }
  .menu-pop > button:hover:not(:disabled) { background: var(--panel-3); border-color: transparent; }
  .menu-pop hr { border: 0; border-top: 1px solid var(--line); margin: 4px 2px; width: 100%; }
  .menu-pop .row-lbl { display: flex; align-items: center; justify-content: space-between;
                       gap: 10px; padding: 4px 9px; }
  .menu-pop .about { padding: 4px 9px; font-size: 11px; color: var(--fg-dim); line-height: 1.6; }
  .menu-pop .about a { color: var(--fg-dim); }
  .menu-pop .about a:hover { color: var(--accent); }

  /* ---------- plan tab ---------- */
  /* wraps rather than overflowing: the panel is 340px and a date input plus two nudge
     buttons does not always fit beside its label */
  .plan-row { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .plan-row > label { flex: 1 1 auto; font-size: 12px; }
  .plan-row .ctl { display: flex; gap: 6px; align-items: center; flex: 0 0 auto; }
  .plan-row .ctl input[type=date] { width: 130px; }
  .plan-row .ctl button { padding: 5px 7px; font-variant-numeric: tabular-nums; }

  /* ---------- layout ---------- */
  #main { flex: 1 1 auto; display: flex; min-height: 0; }
  /* the gantt scrolls horizontally inside itself, so #chart-wrap only scrolls vertically
     and the name gutter stays put beside it */
  #chart-wrap { flex: 1 1 auto; min-width: 0; display: flex; align-items: flex-start;
                overflow-x: hidden; overflow-y: auto; }
  #gutter { flex: 0 0 250px; background: var(--panel); border-right: 1px solid var(--line); }
  #gantt { flex: 1 1 auto; min-width: 0; }
  #gantt-empty { padding: 40px; color: var(--fg-dim); }

  .g-head { display: flex; align-items: flex-end; padding: 0 9px 7px;
            border-bottom: 1px solid var(--line); color: var(--fg-dim);
            font-size: 11px; text-transform: uppercase; letter-spacing: .6px; box-sizing: border-box; }
  .g-row { display: flex; align-items: center; gap: 6px; padding: 0 9px; cursor: pointer;
           border-bottom: 1px solid var(--line-2); box-sizing: border-box; }
  .g-row:hover { background: var(--panel-3); }
  .g-row.sel { background: var(--sel-bg); box-shadow: inset 2px 0 0 var(--accent); }
  .g-row .nm { flex: 1 1 auto; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .g-row .mt { flex: 0 0 auto; font-size: 11px; color: var(--fg-dim); font-variant-numeric: tabular-nums; }
  .g-row.bad .mt { color: var(--warn-fg); font-weight: 600; }
  .g-row .dot { flex: 0 0 auto; width: 7px; height: 7px; border-radius: 2px; background: var(--series-none); }
  .g-row.crit .nm { color: var(--crit-fg); }

  /* The gutter carries every task name, so the label frappe draws inside the bar is a
     duplicate - and an unreadable one in light mode: no single ink is legible on all eight
     slots (white fails on yellow and aqua, dark fails on blue and violet). frappe already
     hid the labels too long to fit, so half of them were missing anyway. Drop them all and
     let the gutter be the label. */
  .gantt .bar-label, .gantt .bar-label.big { display: none; }
  #side {
    flex: 0 0 340px; border-left: 1px solid var(--line); background: var(--panel);
    display: flex; flex-direction: column; min-height: 0;
  }
  #side-tabs { display: flex; border-bottom: 1px solid var(--line); flex: 0 0 auto; }
  #side-tabs button { flex: 1; border: 0; border-radius: 0; background: transparent; padding: 8px; color: var(--fg-dim); }
  #side-tabs button.on { color: var(--fg); box-shadow: inset 0 -2px 0 var(--accent); }
  .side-body { flex: 1 1 auto; overflow: auto; padding: 10px; }
  .side-body[hidden] { display: none; }

  /* ---------- findings ---------- */
  .finding { border: 1px solid var(--line); border-left-width: 3px; border-radius: 6px; padding: 7px 9px; margin-bottom: 7px; background: var(--panel-2); }
  .finding.error { border-left-color: var(--err); }
  .finding.warn { border-left-color: var(--warn); }
  .finding.info { border-left-color: var(--fg-dim); }
  .finding .h { font-weight: 600; margin-bottom: 2px; }
  .finding .m { color: var(--fg-dim); font-size: 12px; }
  .finding .acts { margin-top: 6px; display: flex; gap: 6px; }
  .finding .acts button { padding: 3px 8px; font-size: 12px; }
  .group-h { color: var(--fg-dim); text-transform: uppercase; font-size: 11px; letter-spacing: .6px; margin: 12px 0 6px; }
  .group-h:first-child { margin-top: 0; }

  /* ---------- editor ---------- */
  .field { margin-bottom: 10px; }
  .field > label { display: block; margin-bottom: 3px; font-size: 12px; }
  .field input[type=text], .field textarea, .field select { width: 100%; }
  .field textarea { min-height: 54px; resize: vertical; }
  .row2 { display: flex; gap: 8px; }
  .row2 > * { flex: 1; }
  .picker { max-height: 160px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; padding: 4px; background: var(--panel-2); }
  .picker label { display: flex; gap: 6px; align-items: flex-start; padding: 2px 3px; color: var(--fg); font-size: 12px; cursor: pointer; }
  .picker label:hover { background: var(--panel-3); }
  .picker input { margin-top: 3px; flex: 0 0 auto; }
  .hint { color: var(--fg-dim); font-size: 11px; margin-top: 3px; }
  .est-cmp { display: flex; gap: 10px; font-size: 12px; color: var(--fg-dim); }

  /* ---------- columns ---------- */
  .colmap { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; }
  .colmap label { flex: 0 0 96px; font-size: 12px; }
  .colmap select { flex: 1 1 auto; min-width: 0; }
  .colmap.unmapped label { color: var(--warn-fg); }
  .legend { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 4px; }
  .legend span { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .legend i { width: 9px; height: 9px; border-radius: 2px; display: inline-block; }
  .passthru { font-size: 12px; color: var(--fg-dim); }

  /* ---------- load table ---------- */
  table.load { width: 100%; border-collapse: collapse; font-size: 12px; }
  table.load th, table.load td { text-align: left; padding: 3px 6px; border-bottom: 1px solid var(--line); }
  table.load th { color: var(--fg-dim); font-weight: 500; }
  table.load td.over { color: var(--danger-fg); font-weight: 600; }
  .kv { display: flex; justify-content: space-between; padding: 3px 0; border-bottom: 1px solid var(--line); }
  .kv span:last-child { font-variant-numeric: tabular-nums; }

  /* ---------- gantt bar colours ---------- */
  .gantt .bar-wrapper .bar { fill: var(--series-none); }
  .gantt .bar-wrapper.critical .bar { stroke: var(--crit); stroke-width: 2px; }
  .gantt .bar-wrapper.mismatch .bar { stroke: var(--warn); stroke-width: 2px; stroke-dasharray: 4 3; }
  /* --fg, not --on-accent: the selection ring was white, which is invisible on a light
     surface. Primary ink reads against the bar fill in both themes. */
  .gantt .bar-wrapper.selected .bar { stroke: var(--fg); stroke-width: 2px; }
  .gantt .bar-progress { fill: transparent; }
  /* EVERY frappe token is pinned to one of ours, including the ones this app never shows.
     frappe ships its own dark values under `html[data-theme=dark]` - the same attribute the
     theme toggle sets - so an unpinned token would take frappe's DARK default when the
     toggle says dark but its LIGHT default under OS-dark with the toggle on Auto. That
     split is how --g-weekend-highlight-color ends up flashing near-white on column hover
     in one dark path and not the other. Pinning all of them makes the two paths identical. */
  .gantt-container {
    --g-bar-color: var(--series-none); --g-bar-border: var(--line);
    --g-border-color: var(--line); --g-row-color: var(--row);
    --g-row-border-color: var(--row-line); --g-header-background: var(--panel);
    --g-text-dark: var(--fg); --g-text-light: var(--on-accent); --g-text-muted: var(--fg-dim);
    --g-tick-color: var(--tick); --g-tick-color-thick: var(--tick-thick);
    --g-arrow-color: var(--arrow); --g-handle-color: var(--handle);
    --g-actions-background: var(--panel-2); --g-popup-actions: var(--panel-2);
    --g-progress-color: var(--panel-3); --g-expected-progress: var(--panel-3);
    --g-today-highlight: var(--accent);
    --g-weekend-highlight-color: var(--panel-3); --g-weekend-label-color: var(--panel-3);
    background: var(--bg); }
  .gantt .lower-text, .gantt .upper-text { fill: var(--fg-dim); }
  .gantt .mon .lower-text { fill: var(--fg); }

  /* Until the tour has been taken, its button announces itself with a slow accent ring.
     Finite would stop inviting anyone who looks up ten seconds later, so it loops - but
     gently, and it disappears for good once taken. Motion is opt-out: a reduced-motion
     preference keeps the accent border and drops the animation. */
  #btn-help.invite { border-color: var(--accent); color: var(--accent); font-weight: 600;
    animation: invite-pulse 2.4s ease-in-out infinite; }
  /* a token rather than color-mix(): the ring is a colour like any other, and color-mix is
     new enough that a browser without it would silently drop the whole declaration */
  @keyframes invite-pulse {
    0%, 100% { box-shadow: 0 0 0 0 transparent; }
    50%      { box-shadow: 0 0 0 4px var(--accent-ring); }
  }
  @media (prefers-reduced-motion: reduce) {
    #btn-help.invite { animation: none; }
  }

  /* ---------- guided tour (driver.js) ----------
     driver.css hard-codes its colours and exposes no custom properties for them, so its
     popover is re-skinned here against our tokens. Without this the tour is a white card
     in dark mode. */
  .driver-popover { background-color: var(--panel); color: var(--fg);
    border: 1px solid var(--line); box-shadow: 0 12px 32px var(--shadow); }
  .driver-popover-title { color: var(--fg); font-size: 15px; }
  .driver-popover-description { color: var(--fg-dim); }
  .driver-popover-progress-text { color: var(--fg-dim); }
  .driver-popover-close-btn { color: var(--fg-dim); }
  .driver-popover-close-btn:hover, .driver-popover-close-btn:focus { color: var(--fg); }
  .driver-popover-footer-btn { background-color: var(--panel-2); color: var(--fg);
    border: 1px solid var(--line); border-radius: 6px; padding: 4px 9px; }
  .driver-popover-footer-btn:hover, .driver-popover-footer-btn:focus {
    background-color: var(--panel-3); border-color: var(--line-strong); }
  /* the arrow is a border trick, so it needs the panel colour on every side */
  .driver-popover-arrow-side-left   { border-left-color: var(--panel); }
  .driver-popover-arrow-side-right  { border-right-color: var(--panel); }
  .driver-popover-arrow-side-top    { border-top-color: var(--panel); }
  .driver-popover-arrow-side-bottom { border-bottom-color: var(--panel); }
  .driver-popover code { background: var(--panel-2); border: 1px solid var(--line);
    border-radius: 4px; padding: 0 4px; font-size: 12px; }

  /* ---------- dropzone ---------- */
  #drop {
    position: fixed; inset: 0; background: var(--drop-veil); z-index: 50;
    display: none; align-items: center; justify-content: center; font-size: 18px; color: var(--fg);
    border: 3px dashed var(--accent);
  }
  #drop.on { display: flex; }
  #toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: var(--panel-2); border: 1px solid var(--line); border-radius: 8px;
    padding: 8px 14px; z-index: 60; opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.on { opacity: 1; }

  /* ---------- selftest ---------- */
  #selftest { display: none; padding: 20px; overflow: auto; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }
  body.selftest #toolbar, body.selftest #main { display: none; }
  body.selftest #selftest { display: block; }
  #selftest .p { color: var(--ok); }
  #selftest .f { color: var(--err); font-weight: 700; }
  #selftest h2 { font-family: inherit; font-size: 14px; margin: 18px 0 6px; color: var(--fg-dim); }
</style>
</head>
<body>

<div id="toolbar">
  <span class="brand">Timeline Planner <small id="file-name">plan.csv</small></span>
  <div class="sep"></div>

  <!-- Tier 1: what you do constantly, and the modes that change what a drag means. These
       stay visible because Undo/Redo are per-edit and Rigid/ASAP is live state you need to
       see WHILE dragging - hiding it behind a menu would make the same gesture behave two
       different ways with no visible cause. -->
  <div class="grp">
    <button id="btn-undo" title="Undo (Cmd/Ctrl+Z)">Undo</button>
    <button id="btn-redo" title="Redo (Cmd/Ctrl+Shift+Z)">Redo</button>
    <button id="btn-add" class="primary">+ Task</button>
  </div>
  <div class="sep"></div>

  <div class="grp">
    <label>Propagation</label>

    </div>

            <button data-theme="auto" title="Follow the operating system setting">Auto</button>

        </div>
      </div>

  <input type="file" id="file-input" accept=".csv,.tsv,.txt" hidden>
